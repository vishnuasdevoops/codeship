<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="card-style.css">
</head>

<body>
    <section class="card">
        <div class="card-style">
            <div class="card-header">
                <span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-folder-lock w-6 h-6 text-[#008744]">
                        <rect width="8" height="5" x="14" y="17" rx="1"></rect>
                        <path
                            d="M10 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v2.5">
                        </path>
                        <path d="M20 17v-2a2 2 0 1 0-4 0v2"></path>
                    </svg></span>
                <div>
                    <h2>Your Insurance Vault</h2>
                    <p>All your policies. Safe, organized and always accessible.</p>
                </div>
            </div>
            <div class="card-body">
                <div class="card-img">
                    <img src="imgs/insurance-vault.png" alt="Insurance Vault">
                </div>


            </div>
            <div class="card-content">
                <ul>
                    <li><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-folder-lock w-4 h-4 text-[#008744]">
                            <rect width="8" height="5" x="14" y="17" rx="1"></rect>
                            <path
                                d="M10 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v2.5">
                            </path>
                            <path d="M20 17v-2a2 2 0 1 0-4 0v2"></path>
                        </svg><span>Secure digital policy vault</span></li>
                    <li><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-badge-check w-4 h-4 text-[#008744]">
                            <path
                                d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z">
                            </path>
                            <path d="m9 12 2 2 4-4"></path>
                        </svg><span>Health cards always at hand</span></li>
                    <li><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-bell w-4 h-4 text-[#008744]">
                            <path d="M10.268 21a2 2 0 0 0 3.464 0"></path>
                            <path
                                d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326">
                            </path>
                        </svg><span>Timely renewal reminders</span></li>
                </ul>
            </div>
            <div class="btn">
                <button class="btn-primary"><span>View My Policies</span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px" fill="#e3e3e3"><path d="M16.18,13H4V11H16.18l-5.6-5.6L12,4l8,8l-8,8l-1.42-1.4l5.6-5.6Z"/></svg>
                </button>
                
            </div>
        </div>
    </section>
</body>

</html>
